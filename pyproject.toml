[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rtdl-source-tree"
version = "4.0.0"
description = "RTDL V4 Python-facing generic RT-core operator runtime source-tree package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rtdsl*"]
