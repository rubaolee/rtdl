[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rtdl-source-tree"
version = "4.0.0rc1"
description = "Restricted Python callbacks compiled to verified NVIDIA OptiX programs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rtdsl*"]

[tool.setuptools.package-data]
rtdsl = ["schemas/*.json"]
